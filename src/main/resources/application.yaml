spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: local

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        achievement: achievement_channel
        follower: follower_channel

  cache:
    type: redis
    redis:
      time-to-live: 24h
      cache-null-values: false
      use-key-prefix: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id:
        profile-pic: profile-pic-group
    topic:
      profile-pic:
        name: profile-pic-topic
        partition-count: 4

achievement:
  title:
    collector: COLLECTOR
    mr-productivity: MR PRODUCTIVITY
    expert: EXPERT
    sensei: SENSEI
    manager: MANAGER
    celebrity: CELEBRITY
    writer: WRITER
    handsome: HANDSOME

thread-pool:
  achievement-handler-executor:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 100
    name-prefix: AchievementHandlerExecutor-

event-key-cache:
  redis:
    name: events-keys
    time-to-live: 60m

server:
  port: 8085

logging:
  level:
    org.springframework.cache: TRACE

project-service:
  host: localhost
  port: 8082
