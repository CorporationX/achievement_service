spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  cache:
    type: redis
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        achievement: achievement_channel
        follower: follower_channel
      ttl: 30
      ttlUnit: DAYS
      defaultTtl: 60
      defaultTtlUnit: MINUTES
      cache:
        achievement: achievement

  kafka:
    bootstrap-servers: localhost:9092
    backoff:
      init-interval: 1000
      max-retries: 2
      max-interval: 5000
      multiplier: 2
    consumer:
      group-id: achievements
      auto-offset-reset: earliest
    topic:
      commentNew: comment.new

thread-pool:
  size: 7

retry:
  achievement:
    progress:
      maxAttempts: 2
      delay: 1000

server:
  port: 8085

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
