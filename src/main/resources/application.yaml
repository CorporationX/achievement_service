spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: achievement_group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring:
        json:
          add.type.headers: false
          trusted:
            packages: faang.school.achievement.dto.event,faang.school.postservice.dto.event
    topics:
      create-comment-topic: create_comment_topic

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        achievement: achievement_channel
        follower: follower_channel


server:
  port: 8085
  servlet:
    context-path: /api

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

achievement:
  expert:
    title: EXPERT
    required-comments: 1000
