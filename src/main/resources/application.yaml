spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        achievement: achievement_channel
        follower: follower_channel
        goal_attached: goal_attached
        recommendation_event: recommendation_event
    kafka:
      use-kafka: true
      bootstrap-servers: localhost:9092, localhost:9192, localhost:9292
      group_id: event-listeners
      auto_offset: earliest
      concurrency: 3
      topics:
        goal-completed: goal_completed
        goal-attached: goal_attached

  task:
    execution:
      pool:
        size: 2
        max-size: 5

server:
  port: 8085

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
