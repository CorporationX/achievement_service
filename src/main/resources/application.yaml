spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        achievement: achievement_channel
        follower: follower_channel
        mentorship: mentorship_channel

server:
  port: 8085
  servlet:
    context-path: /achievements/api

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

redis:
  topic: achievement_channel
achievement-titles:
  sensei: Сенсей

thread-pool:
  fixed:
    size: 5
