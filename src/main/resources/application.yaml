spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        comment: comment_channel
        achievement: achievement_channel
        follower: follower_channel
        skill-channel: skill_channel

  cache:
    type: redis
    redis:
      time-to-live: 24h
      cache-null-values: false
      use-key-prefix: true

server:
  port: 8085

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
