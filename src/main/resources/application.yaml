spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://78.36.7.9:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml


  data:
    redis:
      port: 6379
      host: localhost

  kafka:
    listener:
      ack-mode: manual_immediate

    bootstrap-servers: localhost:9092
    properties:
      security:
        protocol: PLAINTEXT

    consumer:
      enable-auto-commit: false
      group-id: achievement-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false


app:
  kafka:
    retryable-topic:
      retry: 2
      delay-ms: 30000

    handler:
      retry:
        max-attempts: 3
        initial-delay-ms: 2000
        multiplier: 2
        max-delay-ms: 10000
      handler-default-completion-time-ms: 10000

    topics:
      comment-create-topic: "comment-create-topic"
      comment-create-events-dlq: "comment-create-topic-dlq"


server:
  port: 8085
  servlet:
    context-path: /api/v1

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user-service:
  host: localhost
  port: 8080