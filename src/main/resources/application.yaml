spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.redisson.hibernate.RedissonRegionFactory

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        achievement: achievement_channel
        follower: follower_channel
        team: team-channel
        comment_channel: comment_topic
        like-event: likeEventTopic
    kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group-id: achievement-group
        auto-offset-reset: earliest
      producer:
        acks: "1"
      topics:
        hashtag-achievement:
          name: "hashtag-achievement"
          partitions: 3
          replicas: 1

  profiles:
    active: local

server:
  port: 8085

logging:
  level:
    root: debug

project-service:
  host: localhost
  port: 8082

achievement-async-config:
  team:
    pool-size: 3
  comment:
    pool-size: 3
  like:
    pool-size: 3
  hashtag:
    pool-size: 3
