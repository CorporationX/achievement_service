spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        achievement: achievement_channel
        follower: follower_channel
        profile-pic: profile_pic_channel
      key-prefix:
        achievement: "cache:achievement:"

app:
  service:
    achievement: default
    achievement-cache: default
    achievement-progress: default
    user-achievement: default

  retry:
    handsome-achievement:
      max-attempts: 3
      delay: 1000
      multiplier: 2

async:
  pool:
    achievement:
      handsome: 8

server:
  port: 8085

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082
